    Experience:
      - company: Embodied Agent Group, ModelBest Inc.
        position: Research Intern
        location: Beijing, China
        start_date: 2024-02
        end_date: 2024-07
        summary: Advised by Zhiyuan Liu; latent action prediction in vision-language models.
        highlights:
          - Investigated state-of-the-art multimodal and video-based embodied learning methods, including Flamingo, Genie, UniPi, Video PreTraining (VPT), and AVDC, and explored latent-action learning by predicting future visual states and recovering control actions from frame transitions via inverse dynamics.

      - company: Intelligent Control Lab, Carnegie Mellon University
        position: Research Intern
        location: Pittsburgh, PA
        start_date: 2023-09
        end_date: 2023-12
        summary: Advised by Changliu Liu; human-robot collaboration and time-series prediction.
        highlights:
          - Proposed and developed a multimodal hierarchical human-robot collaboration framework integrating vision, speech, hierarchical plan prediction, and online user adaptation; deployed it on a Kinova Gen3 for long-horizon toy car assembly, achieving 91.8% task success, 15.9% faster completion, and 84% user satisfaction.

      - company: Computer Vision Lab, Tsinghua University
        position: Undergraduate Research Intern
        location: Beijing, China
        start_date: 2021-05
        end_date: 2022-05
        summary: Advised by Jiwen Lu; 2D image super-resolution.
        highlights:
          - Co-developed Implicit Pixel Flow (IPF), a model-agnostic coordinate-warping framework for photorealistic arbitrary-scale super-resolution.

